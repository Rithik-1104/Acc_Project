name: CI/CD Pipeline & Docker Registry

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  # -------------------------------------------------------------
  # Job 1: Automated Unit & Distributed Consensus Test Suite
  # -------------------------------------------------------------
  test-backend:
    name: Backend Tests & Consensus Verification
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cinema_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest Suite
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/cinema_db
          FAULT_AUTH_TOKEN: dev-fault-insecure-local-token
          PYTHONPATH: .
        run: |
          # Run core consensus, distributed lock, fault isolation, and unit test suites
          pytest tests/test_consensus_cluster.py \
                 tests/test_consensus_unit.py \
                 tests/test_distributed_locks.py \
                 tests/test_cinema_booking_app.py \
                 tests/test_event_bus_and_metrics.py \
                 tests/test_fault_isolation_and_security.py -v

  # -------------------------------------------------------------
  # Job 2: Frontend Production Build Verification
  # -------------------------------------------------------------
  build-frontend:
    name: Frontend Build Verification
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Build Vite Production Assets
        run: npm run build

  # -------------------------------------------------------------
  # Job 3: Build & Publish Backend Docker Image to Docker Hub
  # -------------------------------------------------------------
  docker-publish:
    name: Docker Hub Image Build & Push
    needs: [test-backend, build-frontend]
    runs-on: ubuntu-latest
    # Push image only on push to main/master branches (not on unmerged PRs)
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Check Docker Hub Credentials Availability
        id: check_creds
        run: |
          if [ -n "${{ secrets.DOCKERHUB_USERNAME }}" ] && [ -n "${{ secrets.DOCKERHUB_TOKEN }}" ]; then
            echo "has_creds=true" >> $GITHUB_OUTPUT
          else
            echo "has_creds=false" >> $GITHUB_OUTPUT
            echo "::warning::Docker Hub credentials secrets (DOCKERHUB_USERNAME, DOCKERHUB_TOKEN) are not set. Image build will be validated without pushing."
          fi

      - name: Log in to Docker Hub
        if: steps.check_creds.outputs.has_creds == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Metadata (Tags & Labels)
        id: meta
        if: steps.check_creds.outputs.has_creds == 'true'
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/raft-consensus-backend
          tags: |
            type=sha,format=short,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: backend/Dockerfile
          push: ${{ steps.check_creds.outputs.has_creds == 'true' }}
          tags: ${{ steps.check_creds.outputs.has_creds == 'true' && steps.meta.outputs.tags || 'raft-consensus-backend:local-test' }}
          labels: ${{ steps.check_creds.outputs.has_creds == 'true' && steps.meta.outputs.labels || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
